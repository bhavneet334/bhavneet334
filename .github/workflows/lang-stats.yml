name: Language SVG Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Generate SVG
        run: node scripts/lang-svg.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload SVG artifact
        uses: actions/upload-artifact@v4
        with:
          name: languages-preview
          path: languages.svg
